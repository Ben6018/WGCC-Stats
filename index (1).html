<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warwick Greenwood Cricket Club — Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d1b16;--paper:#f3efe3;--field:#1f5c3d;--field-bright:#2f8f5b;
  --gold:#c8a24a;--clay:#b5523a;--line:rgba(13,27,22,0.14);
  --mono:'IBM Plex Mono',monospace;--cond:'Barlow Condensed',sans-serif;--serif:'Fraunces',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--cond);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

/* HEADER */
header{background:var(--ink);color:var(--paper);padding:0 clamp(16px,4vw,48px);position:sticky;top:0;z-index:50}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 0 12px;border-bottom:1px solid rgba(243,239,227,.14)}
.brand{display:flex;align-items:center;gap:14px;cursor:pointer}
.crest{width:46px;height:46px;border-radius:50%;object-fit:contain;flex-shrink:0;background:#fff;border:2px solid var(--gold)}
.brand-text h1{font-family:var(--cond);font-weight:700;font-size:19px;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.brand-text .sub{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.1em;margin-top:3px}
nav{display:flex;gap:2px;flex-wrap:wrap;padding:8px 0 0}
nav a{color:rgba(243,239,227,.7);font-weight:600;font-size:15px;letter-spacing:.03em;text-transform:uppercase;padding:8px 14px;border-radius:4px 4px 0 0;cursor:pointer;transition:.15s}
nav a:hover{color:var(--paper);background:rgba(243,239,227,.08)}
nav a.active{color:var(--ink);background:var(--gold)}

main{max-width:1120px;margin:0 auto;padding:clamp(20px,3vw,36px) clamp(16px,4vw,48px) 60px}
.page{display:none}.page.show{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* HERO */
.hero{background:linear-gradient(135deg,var(--field) 0%,var(--ink) 90%);color:var(--paper);padding:clamp(26px,4vw,44px) clamp(16px,4vw,48px);margin:0 -100vw;padding-left:max(clamp(16px,4vw,48px),calc(50vw - 560px + clamp(16px,4vw,48px)));padding-right:max(clamp(16px,4vw,48px),calc(50vw - 560px + clamp(16px,4vw,48px)))}
.hero-in{max-width:1120px;margin:0 auto}
.hero .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
.hero h2{font-family:var(--serif);font-weight:900;font-size:clamp(30px,6vw,54px);line-height:.98;margin:8px 0 4px}
.hero .since{opacity:.82;font-size:16px}
.hero-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;margin-top:24px;background:rgba(243,239,227,.14);border:1px solid rgba(243,239,227,.14);border-radius:6px;overflow:hidden}
.hstat{background:rgba(13,27,22,.4);padding:14px 16px}
.hstat .n{font-family:var(--serif);font-weight:900;font-size:clamp(18px,2.6vw,28px);line-height:1}
.hstat .l{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:rgba(243,239,227,.7);margin-top:6px}
@media(max-width:760px){.hero-stats{grid-template-columns:repeat(2,1fr)}}

section{margin:28px 0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:14px}
.sec-head h3{font-family:var(--cond);font-weight:700;font-size:18px;letter-spacing:.05em;text-transform:uppercase}
.sec-head .more{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--field);cursor:pointer}
.sec-head .more:hover{color:var(--clay)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}

/* CAREER GRADE SPLIT + MATES/OPPS (added) */
.gsplit{display:flex;gap:12px;flex-wrap:wrap;margin:4px 0 8px}
.gs{background:var(--field);color:var(--paper);border-radius:8px;padding:12px 20px;min-width:120px;text-align:center;border:1px solid rgba(200,162,74,.4)}
.gs-n{font-family:var(--serif);font-weight:900;font-size:30px;line-height:1}
.gs-l{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-top:6px}
.mo-wrap{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:10px}
@media(max-width:820px){.mo-wrap{grid-template-columns:1fr}}
.mo-col table{width:100%}
/* SEASON SPLIT CHART */
.sslegend{font-family:var(--mono);font-size:11px;margin:2px 0 8px}
.sslegend .lg-r{color:var(--field-bright)}.sslegend .lg-w{color:var(--clay)}
.ssplit{display:flex;align-items:flex-end;gap:6px;overflow-x:auto;padding:6px 2px 0;border-bottom:1px solid var(--line);min-height:96px}
.ssb{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.ssb-bars{display:flex;align-items:flex-end;gap:2px;height:72px}
.ssb-r{width:9px;background:var(--field-bright);border-radius:2px 2px 0 0}
.ssb-w{width:9px;background:var(--clay);border-radius:2px 2px 0 0}
.ssb-y{font-family:var(--mono);font-size:9px;color:#8a8a7a;margin-top:4px}
/* MILESTONE TIMELINE */
.mstl{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 8px}
.mstl-item{background:#fff;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:6px;padding:8px 14px;min-width:150px}
.mstl-mark{font-family:var(--serif);font-weight:900;font-size:17px;color:var(--field)}
.mstl-det{font-family:var(--mono);font-size:11px;color:#8a8a7a;margin-top:3px}
/* CAREER SPAN */
.cspan{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 16px;margin:4px 0 8px;max-width:520px}
.cs-row{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--line)}
.cs-row:last-child{border-bottom:none}
.cs-k{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8a8a7a}
.cs-v{font-weight:600;text-align:right}
/* PLAYHQ HIGHLIGHTS */
.hl-wrap{display:flex;flex-wrap:wrap;gap:20px;margin:6px 0 10px}
.hl-col{flex:1;min-width:220px}
.hl-cap{font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:#8a8a7a;margin-bottom:4px}
.hl-item{font-size:14px;padding:3px 0;border-bottom:1px solid var(--line)}
.hl-v{font-family:var(--serif);font-weight:900;color:var(--field)}
.hl-sea{font-family:var(--mono);font-size:10px;color:#8a8a7a;float:right}
.hl-era{font-family:var(--mono);font-size:9px;letter-spacing:.04em;text-transform:uppercase;padding:1px 5px;border-radius:3px;margin-left:6px;vertical-align:middle}
.hl-era-phq{background:rgba(47,143,91,.16);color:var(--field)}
.hl-era-myc{background:rgba(181,82,58,.14);color:var(--clay)}
/* GRAND FINAL CARDS */
.gf-season{font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:#8a8a7a;margin:16px 0 8px}
.gf-season:first-child{margin-top:0}
.gf-row{display:flex;flex-wrap:wrap;gap:12px}
.gf-card{flex:1;min-width:160px;background:#fff;border:1px solid var(--line);border-top:4px solid var(--line);border-radius:8px;padding:16px 18px;text-align:center}
.gf-card.gf-win{border-top-color:var(--gold);background:linear-gradient(180deg,#fffdf5,#fff)}
.gf-card.gf-loss{border-top-color:var(--line)}
.gf-flag{font-size:26px;line-height:1}
.gf-grade{font-family:var(--serif);font-weight:900;font-size:19px;margin-top:6px}
.gf-res{font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--field);margin-top:2px}
.gf-win .gf-res{color:var(--clay)}
.gf-opp{font-family:var(--mono);font-size:11px;color:#8a8a7a;margin-top:6px}
/* 25/26 SEASON IN REVIEW */
.s26-list{display:flex;flex-direction:column;gap:6px}
.s26-row{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:6px;padding:10px 14px}
.s26-row.s26-click{cursor:pointer;transition:box-shadow .15s,transform .05s}
.s26-row.s26-click:hover{box-shadow:0 2px 10px rgba(13,27,22,.12)}
.s26-view{font-family:var(--mono);font-size:10px;color:var(--field);letter-spacing:.04em;margin-left:8px;opacity:0;transition:opacity .15s}
.s26-row.s26-click:hover .s26-view{opacity:1}
.s26-row.s26-w{border-left-color:var(--field-bright)}
.s26-row.s26-l{border-left-color:var(--clay)}
.s26-row.s26-d{border-left-color:var(--gold)}
.s26-rd{font-family:var(--serif);font-weight:900;font-size:15px;color:#8a8a7a;min-width:36px;padding-top:2px}
.s26-badge{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:4px;font-family:var(--cond);font-weight:700;font-size:12px;color:var(--paper)}
.s26-w .s26-badge{background:var(--field-bright)}.s26-l .s26-badge{background:var(--clay)}.s26-d .s26-badge{background:var(--gold);color:var(--ink)}
.s26-head{font-weight:600;font-size:15px}
.s26-margin{font-family:var(--mono);font-size:11px;color:#8a8a7a;text-transform:uppercase;letter-spacing:.04em}
.s26-sub{font-family:var(--mono);font-size:11px;color:#8a8a7a;margin-top:3px}
.s26-perfs{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.s26-perf{font-size:12px;color:var(--field)}

/* BOARDS */
.board{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.brow{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;padding:10px 15px;border-bottom:1px solid var(--line);cursor:pointer}
.brow:last-child{border-bottom:none}
.brow:nth-child(odd){background:rgba(31,92,61,.03)}
.brow:hover{background:rgba(200,162,74,.12)}
.rank{font-family:var(--serif);font-weight:900;font-size:16px;color:var(--gold);text-align:center}
.rank.top{color:var(--field)}
.pname{font-family:var(--cond);font-weight:600;font-size:16px}
.pmeta{font-family:var(--mono);font-size:11px;color:#6a6a5f;margin-top:1px}
.pbig{font-family:var(--serif);font-weight:900;font-size:18px;text-align:right}

/* SUMMARY TILES */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:#fff;border:1px solid var(--line);border-radius:8px;padding:15px}
.tile .n{font-family:var(--serif);font-weight:900;font-size:26px;line-height:1;color:var(--field)}
.tile .l{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#6a6a5f;margin-top:8px}
.tile.wl .wl-row{display:flex;gap:9px;margin-top:6px;font-family:var(--cond);font-weight:600;font-size:14px}
.tile.wl .w{color:var(--field-bright)}.tile.wl .l2{color:var(--clay)}.tile.wl .d{color:#8a8a7a}

/* MATCHES + TABLES */
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
th{background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;text-align:right;padding:9px 12px;font-weight:500}
th:first-child{text-align:left}
td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:15px;text-align:right}
td:first-child{text-align:left;font-weight:600}
tr:last-child td{border-bottom:none}
tr:nth-child(even) td{background:rgba(31,92,61,.03)}
.res-w{color:var(--field);font-weight:700}.res-l{color:var(--clay);font-weight:700}.res-d{color:#8a8a7a;font-weight:700}

/* SEARCH */
.search{width:100%;padding:12px 16px;font-family:var(--cond);font-size:17px;border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:16px}
.search:focus{outline:2px solid var(--field-bright);border-color:transparent}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:13px 15px;cursor:pointer;transition:.12s}
.pcard:hover{border-color:var(--field-bright);box-shadow:0 2px 10px rgba(31,92,61,.1);transform:translateY(-1px)}
.pcard .nm{font-family:var(--cond);font-weight:700;font-size:17px}
.pcard .st{font-family:var(--mono);font-size:11px;color:#6a6a5f;margin-top:4px}

/* PROFILE */
.back{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--field);cursor:pointer;margin-bottom:14px}
.back:hover{color:var(--clay)}
.phero{background:linear-gradient(135deg,var(--field),var(--ink));color:var(--paper);border-radius:10px;padding:24px 26px;margin-bottom:22px}
.phero h2{font-family:var(--serif);font-weight:900;font-size:clamp(26px,4vw,40px);line-height:1}
.phero .pn{font-family:var(--mono);font-size:12px;color:var(--gold);letter-spacing:.08em;margin-top:6px}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:18px;background:rgba(243,239,227,.14);border:1px solid rgba(243,239,227,.14);border-radius:6px;overflow:hidden}
.ps{background:rgba(13,27,22,.35);padding:12px 14px}
.ps .n{font-family:var(--serif);font-weight:900;font-size:22px;line-height:1}
.ps .l{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:rgba(243,239,227,.7);margin-top:5px}
@media(max-width:560px){.pstats{grid-template-columns:repeat(2,1fr)}}
.cardrow{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:8px}
@media(max-width:760px){.cardrow{grid-template-columns:1fr}}
.mini-h{font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--field);margin:18px 0 8px}

footer{background:var(--ink);color:rgba(243,239,227,.72);padding:26px clamp(16px,4vw,48px);margin-top:24px}
.foot-in{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center}
.foot-in .built{font-family:var(--mono);font-size:11px}
.updated{font-family:var(--mono);font-size:11px;color:rgba(243,239,227,.5)}
.note{font-family:var(--mono);font-size:11px;color:#8a8a7a;margin-top:8px}
.badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.badge{display:inline-flex;align-items:center;gap:5px;background:var(--gold);color:var(--ink);font-family:var(--cond);font-weight:700;font-size:12px;padding:4px 10px;border-radius:20px;letter-spacing:.02em}
.badge.life{background:var(--clay);color:#fff}
.badge.champ{background:var(--field-bright);color:#fff}
.badge.hof{background:linear-gradient(135deg,#8b6f1f,var(--gold));color:var(--ink);box-shadow:0 0 0 2px rgba(200,162,74,.35)}
.badge.baggy{background:var(--ink);color:var(--gold);border:1px solid var(--gold)}
.badge .x{font-family:var(--mono);font-size:10px;opacity:.85}
.agrade{display:flex;flex-wrap:wrap;gap:14px;align-items:center;background:var(--ink);color:var(--paper);border-radius:8px;padding:12px 16px;margin:16px 0}
.agrade .ag-no{font-family:var(--serif);font-weight:900;font-size:18px;color:var(--gold)}
.agrade .ag-debut{font-family:var(--mono);font-size:12px;color:rgba(243,239,227,.8)}
.gl-season{margin-bottom:16px}
.gl-yr{font-family:var(--cond);font-weight:700;font-size:15px;color:var(--field);letter-spacing:.04em;margin-bottom:6px}
.caret{color:var(--gold);font-size:12px}
.hstrip{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.hchip{display:inline-flex;flex-direction:column;background:var(--ink);border:1px solid var(--gold);border-radius:6px;padding:5px 11px;min-width:0}
.hchip .hc-l{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:rgba(200,162,74,.9)}
.hchip .hc-v{font-family:var(--serif);font-weight:900;font-size:15px;color:var(--paper);line-height:1.1}
.hchip.hof{background:linear-gradient(135deg,#8b6f1f,var(--gold));border-color:var(--gold)}
.hchip.hof .hc-l{color:rgba(13,27,22,.75)}.hchip.hof .hc-v{color:var(--ink)}
.hchip.life{background:var(--clay);border-color:var(--clay)}
.hchip.life .hc-l{color:rgba(255,255,255,.85)}.hchip.life .hc-v{color:#fff}
.gl-wrap{display:flex;flex-direction:column;gap:6px}
.gl-block{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.gl-head{padding:10px 14px;cursor:pointer;font-family:var(--cond);font-size:15px;display:flex;align-items:center;gap:8px}
.gl-head:hover{background:rgba(200,162,74,.1)}
.gl-head .gl-sum{font-family:var(--mono);font-size:11px;color:#6a6a5f;margin-left:auto}
.gl-body{border-top:1px solid var(--line)}
.gl-body table{border:none;border-radius:0}
.decade-banner{background:linear-gradient(135deg,var(--ink),var(--field) 60%,var(--gold));color:var(--paper);border-radius:8px;padding:14px 18px;margin:16px 0;display:flex;align-items:center;gap:12px;box-shadow:0 0 0 2px rgba(200,162,74,.4)}
.decade-banner .db-star{font-size:22px;color:var(--gold)}
.decade-banner b{font-family:var(--serif);font-size:19px}
.decade-banner .db-sub{font-family:var(--mono);font-size:12px;color:rgba(243,239,227,.85);margin-left:auto}
.ach-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.ach-chip{display:inline-flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 12px}
.ach-chip.ach-elite{border-color:var(--gold);background:linear-gradient(135deg,#fff,#faf3dd)}
.ach-chip .ach-t{font-family:var(--cond);font-weight:700;font-size:14px;color:var(--field)}
.ach-chip .ach-s{font-family:var(--mono);font-size:11px;color:#6a6a5f;margin-top:2px}
.an-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:8px}
@media(max-width:760px){.an-grid{grid-template-columns:1fr}}
.an-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px}
.an-title{font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--field);margin-bottom:14px}
.dist{display:flex;align-items:flex-end;gap:8px;height:120px}
.dbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px}
.dbar-fill{width:100%;border-radius:3px 3px 0 0;min-height:2px}
.dbar-v{font-family:var(--serif);font-weight:900;font-size:14px}
.dbar-l{font-family:var(--mono);font-size:9px;color:#6a6a5f}
.hows{display:flex;flex-direction:column;gap:8px}
.how-row{display:flex;align-items:center;gap:8px}
.how-k{font-family:var(--cond);font-size:14px;width:80px;text-transform:capitalize}
.how-bar{flex:1;background:rgba(0,0,0,.06);border-radius:4px;height:14px;overflow:hidden}
.how-fill{height:100%;border-radius:4px}
.how-v{font-family:var(--mono);font-size:11px;color:#6a6a5f;width:64px;text-align:right}
.ms-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:760px){.ms-grid{grid-template-columns:1fr}}
.ms-col{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 0}
.ms-title{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--field);padding:10px 14px 6px;font-weight:500}
.ms-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 14px;cursor:pointer;border-top:1px solid var(--line)}
.ms-row:hover{background:rgba(200,162,74,.1)}
.ms-who{font-family:var(--cond);font-weight:600;font-size:15px}
.ms-goal{font-family:var(--mono);font-size:11px;color:#6a6a5f;grid-row:2}

.ins-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

tr.bg-bad td{background:rgba(181,82,58,.06)}
tr.bg-good td{background:rgba(47,143,91,.07)}
@media(max-width:600px){.ins-split,.ins-grid2{grid-template-columns:1fr}}
.pm-top{font-family:var(--mono);font-size:11px;font-weight:700;background:rgba(200,162,74,.22);color:#7a5f10;padding:2px 7px;border-radius:3px}

}

.fr-table td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.fr-table td:first-child{color:#8a8a7a;font-family:var(--mono);font-size:11px}
.fr-table tbody tr:hover td{background:rgba(200,162,74,.1)}
/* ---- FIXTURES RESULTS ---- */
.fx-row{background:#fff;border:1px solid var(--line);border-radius:7px;padding:0;overflow:hidden}
.fx-rowtop{display:flex;align-items:center;gap:12px;padding:9px 13px}
.fx-row.fx-won{border-left:4px solid var(--field)}
.fx-row.fx-lost{border-left:4px solid var(--clay)}
.fx-row.fx-past{opacity:.5}
.fx-badge{font-family:var(--mono);font-size:9px;font-weight:700;padding:1px 6px;border-radius:3px;margin-left:6px;vertical-align:middle}
.fx-b-won{background:rgba(47,143,91,.18);color:var(--field)}
.fx-b-lost{background:rgba(181,82,58,.16);color:var(--clay)}
.fx-detail{padding:8px 13px 10px 17px;border-top:1px solid var(--line);background:var(--paper)}
.fx-score{font-size:12px;color:var(--ink);margin-bottom:5px}
.fx-perf{font-size:12px;color:#5a5a4f;margin-top:2px}
.fx-pl{font-family:var(--mono);font-size:9px;text-transform:uppercase;color:#8a8a7a;margin-right:5px}
.fx-player{color:var(--field);cursor:pointer;font-weight:600}
.fx-player:hover{text-decoration:underline}
.rec-score{font-family:var(--mono);font-size:11px;color:#8a8a7a}
/* ---- DEBUT CLASSES ACTIVE ---- */
.dc-p.dc-active{background:rgba(47,143,91,.14);color:var(--field);font-weight:600}
</style>

const app = document.getElementById('app');
const fmt = n => (typeof n==='number'? n.toLocaleString(): n);
// resolve a display name to a canonical player key (for links from honour data)
function resolveInData(name){
  if(!name) return null;
  if(DATA.players[name]) return name;
  const parts=name.split(' ');
  if(parts.length>=2){
    const lk=parts[parts.length-1].toLowerCase()+'|'+parts[0][0].toLowerCase();
    const cands=Object.keys(DATA.players).filter(p=>{const q=p.split(' ');return q[q.length-1].toLowerCase()+'|'+q[0][0].toLowerCase()===lk;});
    if(cands.length===1) return cands[0];
  }
  return null;
}
function setNav(p){document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.dataset.p===p));}

// ---------- HOME ----------
function renderHome(){
  const h=DATA.home;
  const board=(arr)=>arr.map((x,i)=>`<div class="brow" onclick="openPlayer('${x.name.replace(/'/g,"\\'")}')">
    <div class="rank ${i===0?'top':''}">${i+1}</div>
    <div><div class="pname">${x.name}</div><div class="pmeta">${x.extra||''}</div></div>
    <div class="pbig">${x.v}</div></div>`).join('');
  const recent=h.recent.map(m=>{
    if(m.fixture) return `<tr><td>${m.fixture}${m.final?' <span class="final-tag">'+(m.rnd||'Final')+'</span>':''}</td><td>${m.grade}</td><td class="res-${m.res[0]}">${m.res.toUpperCase()}</td></tr>`;
    const vs=m.home?'vs':'@';
    const score=(m.wg_score&&m.opp_score)?` <span class="rec-score">${m.wg_score} / ${m.opp_score}</span>`:'';
    return `<tr><td>${m.rnd?m.rnd.replace('Round ','R')+' ':''}${vs} ${m.opp}${score}</td><td>${m.grade}</td><td class="res-${m.res[0]}">${m.res.toUpperCase()}</td></tr>`;
  }).join('');
  return `
  <div class="hero"><div class="hero-in">
    <img class="hero-logo" src="${WGCC_LOGO}" alt="Warwick Greenwood Cricket Club">
    <div class="eyebrow">Club Dashboard · All Seasons</div>
    <h2>Warwick Greenwood</h2>
    <div class="since">15 seasons of history — MyCricket and PlayHQ eras combined · 2026/27 season now live</div>
    <div class="hero-stats">
      <div class="hstat"><div class="n">${h.players}</div><div class="l">Players</div></div>
      <div class="hstat"><div class="n">${h.runs}</div><div class="l">Career Runs</div></div>
      <div class="hstat"><div class="n">${h.wkts}</div><div class="l">Career Wickets</div></div>
      <div class="hstat"><div class="n">${h.games}</div><div class="l">Games</div></div>
      <div class="hstat"><div class="n">${h.win_rate}</div><div class="l">Win Rate</div></div>
    </div>
  </div></div>
  <main><div class="page show">
    <section><div class="sec-head"><h3>All-Time Summary</h3></div>
      <div class="tiles">
        <div class="tile"><div class="n">${h.win_rate}</div><div class="l">Win Rate</div></div>
        <div class="tile"><div class="n">${h.runs}</div><div class="l">Total Runs</div></div>
        <div class="tile"><div class="n">${h.wkts}</div><div class="l">Total Wickets</div></div>
        <div class="tile wl"><div class="l">Results (W/L/D/NR)</div>
          <div class="wl-row"><span class="w">${h.w}W</span><span class="l2">${h.l}L</span><span class="d">${h.d}D</span><span class="d">${h.nr}NR</span></div></div>
      </div>
    </section>
    <div class="grid2">
      <section><div class="sec-head"><h3>Most Career Runs</h3><span class="more" onclick="go('records')">All records →</span></div><div class="board">${board(h.top_batters)}</div></section>
      <section><div class="sec-head"><h3>Most Career Wickets</h3><span class="more" onclick="go('records')">All records →</span></div><div class="board">${board(h.top_bowlers)}</div></section>
    </div>
    <section><div class="sec-head"><h3>Recent Matches</h3><span class="more" onclick="go('results')">All results →</span></div>
      <table><thead><tr><th>Fixture</th><th>Grade</th><th>Result</th></tr></thead><tbody>${recent}</tbody></table>
    </section>
    ${milestonesHtml(h.milestones)}
  </div></main>`;
}
function milestonesHtml(m){
  if(!m||!m.batting) return '';
  const col=(title,arr)=>`<div class="ms-col"><div class="ms-title">${title}</div>${arr.map(x=>
    `<div class="ms-row" onclick="openPlayer('${x.name.replace(/'/g,"\\'")}')"><div class="ms-who">${x.name}</div><div class="ms-goal">${x.goal}</div><div class="ms-togo">${x.togo} to go</div></div>`).join('')}</div>`;
  return `<section><div class="sec-head"><h3>Milestones In Reach</h3><span class="more">Closest first</span></div>
    <div class="ms-grid">
      ${col('Batting',m.batting.slice(0,8))}
      ${col('Bowling',m.bowling.slice(0,8))}
      ${col('Matches Played',m.matches.slice(0,8))}
    </div></section>`;
}

// ---------- PLAYERS LIST ----------
let playerIndex=null;
function buildIndex(){
  if(playerIndex) return playerIndex;
  playerIndex=Object.values(DATA.players).map(p=>({
    name:p.name, runs:p.bat.runs, wkts:p.bowl.wkts, matches:p.matches,
    key:p.name.toLowerCase()
  })).sort((a,b)=>(b.runs+b.wkts*15)-(a.runs+a.wkts*15));
  return playerIndex;
}

    <section><div class="sec-head"><h3>Players · ${(DATA.player_index||[]).length} All-Time</h3><span class="more">Tap a column to sort · tap a name for the full profile</span></div>
    <input class="search" id="psearch" value="${plSearch}" placeholder="Search players…" oninput="plSearchFn(this.value)" autocomplete="off">
    <div class="pl-vtabs">${tabs}</div>
    <div id="ptable"></div></section></div></main>`;
}
function setPlView(v){ plView=v;
  // sensible default sort per view
  if(v==='core') plSort={col:'runs',dir:-1};
  else if(v==='batting') plSort={col:'runs',dir:-1};
  else plSort={col:'wkts',dir:-1};
  document.getElementById('app').innerHTML=renderPlayers(); drawPlayerTable();
}
function plSearchFn(q){ plSearch=q; drawPlayerTable(); }
function setPlSort(col){
  if(plSort.col===col) plSort.dir*=-1;
  else plSort={col,dir:-1};
  drawPlayerTable();
}
function drawPlayerTable(){
  const el=document.getElementById('ptable'); if(!el) return;
  const cols = plView==='core'
    ? [['runs','Runs'],['wkts','Wkts'],['games','Games']]
    : plView==='batting'
    ? [['runs','Runs'],['inns','Inns'],['no','NO'],['hs','HS'],['avg','Avg'],['fours','4s'],['sixes','6s'],['f50','50s'],['f100','100s']]
    : [['wkts','Wkts'],['overs','Overs'],['maidens','Mdns'],['b_runs','Runs'],['b_avg','Avg'],['econ','Econ'],['f50','—']];
  // bowling has no 5w stored reliably; drop the placeholder col
  const useCols = plView==='bowling' ? cols.filter(c=>c[0]!=='f50') : cols;
  const q=(plSearch||'').toLowerCase().trim();
  let rows=(DATA.player_index||[]).filter(p=>!q || p.name.toLowerCase().includes(q));
  // filter out players with nothing in this view
  if(plView==='batting') rows=rows.filter(p=>p.inns>0||p.runs>0);
  if(plView==='bowling') rows=rows.filter(p=>p.wkts>0||p.overs>0);
  const {col,dir}=plSort;
  rows.sort((a,b)=>{
    const av=a[col]||0, bv=b[col]||0;
    if(av===bv) return a.name.localeCompare(b.name);
    return (av<bv?-1:1)*dir;
  });
  const cap=q?rows.length:300;
  const head=`<th class="pl-rank">#</th><th class="pl-name" onclick="setPlSort('name')">Player</th>`+
    useCols.map(c=>`<th class="pl-num ${plSort.col===c[0]?'pl-sorted':''}" onclick="setPlSort('${c[0]}')">${c[1]}${plSort.col===c[0]?(plSort.dir<0?' ▾':' ▴'):''}</th>`).join('');
  const body=rows.slice(0,cap).map((p,i)=>{
    const cells=useCols.map(c=>{
      let v=p[c[0]];
      if(c[0]==='avg'||c[0]==='b_avg'||c[0]==='econ') v=(v?v.toFixed(2):'—');
      else if(c[0]==='overs') v=(v||'—');
      else v=(v||0);
      return `<td class="pl-num ${plSort.col===c[0]?'pl-sorted':''}">${v}</td>`;
    }).join('');
    return `<tr onclick="openPlayer('${p.name.replace(/'/g,"\\'")}')">
      <td class="pl-rank">${i+1}</td>
      <td class="pl-name">${p.name}${p.new?' <span class="pl-new">NEW</span>':''}</td>${cells}</tr>`;
  }).join('');
  el.innerHTML=`<div class="pl-scroll"><table class="pl-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`+
    (rows.length>cap?`<div class="pmeta" style="padding:8px">Showing ${cap} of ${rows.length} — search to narrow, or sort to find who you want.</div>`:
     `<div class="pmeta" style="padding:8px">${rows.length} player${rows.length===1?'':'s'}.</div>`);
}

    <div id="ihtable" style="display:none"><table><thead><tr><th>Date</th><th>Match</th><th>Runs</th>${ihHasBalls?'<th>Balls · SR</th>':''}<th style="text-align:left">How Out</th></tr></thead><tbody>${ih}</tbody></table>${a.ih_note?`<div class="note">${a.ih_note}</div>`:''}</div>`;

function gameLogHtml(p){
  if(!p.gameblocks||!p.gameblocks.length) return '';
  const blockCounts=[];
  const blocks=p.gameblocks.map((blk,i)=>{
    const bid='blk_'+i;
    // merge games by date+opp so bat & bowl in same game share a row
    const byGame={};
    let gi=0;
    blk.games.forEach(g=>{
      // When a game has no date, it can't be safely merged with another same-opponent game,
      // so give each dateless innings its own row (prevents two knocks v same team collapsing).
      const k=g.date?(g.date+'|'+g.opp):('_nodate_'+(gi++));
      (byGame[k]=byGame[k]||{date:g.date,opp:g.opp,rd:g.rd});
      if(g.kind==='bat'){byGame[k].bat=g;} else {byGame[k].bowl=g;}});
    const rows=Object.values(byGame).map(gm=>{
      const bat=gm.bat?`${gm.bat.runs}${gm.bat.how==='not out'?'*':''}`:'—';
      const batd=gm.bat?(gm.bat.how||''):'';
      const bowl=gm.bowl?`${gm.bowl.wkts}/${gm.bowl.runs} (${gm.bowl.overs})`:'';
      return `<tr><td style="font-size:13px">${gm.date}</td><td style="font-size:13px">R${gm.rd} v ${gm.opp}</td><td>${bat}</td><td style="font-size:12px;color:#8a8a7a;text-align:left">${batd}</td><td style="font-size:13px;text-align:left">${bowl}</td></tr>`;
    }).join('');
    const summ=[blk.inns?`${blk.runs} runs`:'', blk.wkts?`${blk.wkts} wkts`:''].filter(Boolean).join(' · ');
    const nGames=Object.keys(byGame).length;
    blockCounts.push(nGames);
    return `<div class="gl-block">
      <div class="gl-head" onclick="toggleBlk('${bid}')"><span class="caret" id="c_${bid}">▸</span> <b>${blk.season} · ${blk.grade} Grade</b> <span class="gl-sum">${nGames} game${nGames===1?'':'s'}${summ?' · '+summ:''}</span></div>
      <div class="gl-body" id="${bid}" style="display:none">
        <table><thead><tr><th>Date</th><th>Match</th><th>Bat</th><th style="text-align:left">How Out</th><th style="text-align:left">Bowl</th></tr></thead><tbody>${rows}</tbody></table>
      </div></div>`;
  }).join('');
  const total=blockCounts.reduce((a,b)=>a+b,0);
  const career=p.matches;
  // Only compare against the career figure when it's plausible; a handful of players
  // have an unreliable career match count in the source export.
  const note=(career&&total<=career)
    ? (total<career ? `${total} of ${career} career games have a recorded scorecard` : `${total} games`)
    : `${total} games with a recorded scorecard`;
  return `<div class="mini-h">Game-by-Game · ${note} <span style="font-family:var(--mono);font-size:11px;color:#8a8a7a">(2012–2026 · MyCricket + PlayHQ A Grade)</span></div>
    <div class="gl-wrap">${blocks}</div>`;
}

  Object.entries(awardCounts).forEach(([aw,n])=>{
    if(aw==='Non Compos Mentis') return; // keep the fun one lower down, not in the honour strip
    stripItems.push({label:aw,val:n>1?'×'+n:'✓'});
  });
  const hofNames=new Set(DATA.honours.members.hall_of_fame.map(m=>m.canon||m.name));
  const lifeNames=new Set(DATA.honours.members.wgcc_life.map(m=>m.canon||m.name));
  if(hofNames.has(p.name)) stripItems.unshift({label:'Hall of Fame',val:'★',hof:true});
  if(lifeNames.has(p.name)) stripItems.push({label:'Life Member',val:'✓',life:true});
  const stripHtml=stripItems.length?`<div class="hstrip">${stripItems.map(s=>
    `<div class="hchip ${s.hof?'hof':''} ${s.life?'life':''}"><span class="hc-l">${s.label}</span><span class="hc-v">${s.val}</span></div>`).join('')}</div>`:'';
  // Roles + awards + honours detail sections
  const rolesHtml=(p.roles&&p.roles.length)?`<div class="mini-h">Committee Roles</div>
    <table><thead><tr><th>Role</th><th>Season</th></tr></thead><tbody>${p.roles.slice().reverse().map(r=>`<tr><td>${r.role}</td><td>${r.season}</td></tr>`).join('')}</tbody></table>`:'';
  const awardsSorted=(p.awards||[]).slice().sort((a,b)=>{
    const ya=parseInt(String(a.season).slice(0,4),10)||0, yb=parseInt(String(b.season).slice(0,4),10)||0;
    return yb-ya;
  });
  const awardsHtml=awardsSorted.length?`<div class="mini-h">Awards & Honours</div>
    <table><thead><tr><th>Award</th><th>Season</th><th style="text-align:left">Detail</th></tr></thead><tbody>${awardsSorted.map(a=>`<tr><td>${a.award}${a.source?` <a href="${a.source}" target="_blank" rel="noopener" class="pm-link" title="Awards night report">\u2197</a>`:''}</td><td>${a.season}</td><td style="text-align:left;font-size:13px">${a.detail||''}</td></tr>`).join('')}</tbody></table>`:'';
  // Achievements (team selections, redlow, potm) — with Team of Decade highlighted
  let achHtml='';
  if(p.achievements&&p.achievements.length){
    const decade=p.achievements.filter(a=>a.type==='Team of the Decade');
    const rest=p.achievements.filter(a=>a.type!=='Team of the Decade');
    if(decade.length){
      achHtml+=`<div class="decade-banner"><span class="db-star">★</span> <b>Team of the Decade</b> <span class="db-sub">Inaugural WGCC XI${decade[0].detail==='Captain'?' · Captain':''}</span></div>`;
    }
    if(rest.length){
      achHtml+=`<div class="mini-h">Team Selections & Awards</div><div class="ach-list">${rest.map(a=>{
        const cls=a.elite?'ach-elite':'';
        return `<div class="ach-chip ${cls}"><span class="ach-t">${a.type}</span><span class="ach-s">${a.season}${a.detail?' · '+a.detail:''}</span></div>`;
      }).join('')}</div>`;
    }
  }
  const badgeHtml=(p.badges&&p.badges.length)?`<div class="badges">${p.badges.map(bd=>{
    const cls=bd.t==='Life Member'?'life':(bd.t==='Hall of Fame'?'hof':(bd.t.startsWith('A Grade')?'baggy':(bd.t==='Premierships'?'champ':'')));
    return `<span class="badge ${cls}">${bd.t}${bd.n>1?`<span class="x">×${bd.n}</span>`:''}</span>`;
  }).join('')}</div>`:'';
  const baggyHtml=p.baggy?`<div class="agrade"><span class="ag-no">A Grade Cap #${p.baggy.no}</span><span class="ag-debut">Debut: ${p.baggy.debut}</span></div>`:'';
  const premHtml=(p.prem_detail&&p.prem_detail.length)?`<div class="mini-h">Premierships · ${p.prem_detail.length}</div>
    <div class="prem-cards">${p.prem_detail.map(pr=>{
      const clickable=pr.scorecard_key&&DATA.honours.prem_scorecards&&DATA.honours.prem_scorecards[pr.scorecard_key];
      // format: use the match field, or fall back to the format encoded in the scorecard key (season|grade|FORMAT)
      let fmt=pr.match;
      if(!fmt&&pr.scorecard_key){const parts=pr.scorecard_key.split('|');fmt=parts[2]||'';}
      const md=fmt?({'1D':'One Day','2D':'Two Day','T20':'T20'})[fmt]||'':'';
      return `<div class="prem-card ${clickable?'clickable':''}" ${clickable?`onclick="showScorecard('${pr.scorecard_key}')"`:''}>
        <div class="pc-top"><span class="pc-flag">🏆</span><span class="pc-season">${pr.season}</span></div>
        <div class="pc-grade">${pr.grade&&pr.grade!=='?'?pr.grade+' Grade':''}${md?' · '+md:''}</div>
        ${pr.opp?`<div class="pc-opp">def ${pr.opp}</div>`:''}
        ${clickable?'<div class="pc-view">View scorecard →</div>':''}
      </div>`;
    }).join('')}</div>`:'';
  const batRows=p.bat_seasons.filter(s=>s.inns>0||s.runs>0).map(s=>{
    const outs=s.inns-s.no;const avg=outs>0?(s.runs/outs).toFixed(1):s.runs;
    return `<tr><td>${s.season} ${s.grade}${s.finals==='Y'?' (F)':''}</td><td>${s.m}</td><td>${s.inns}</td><td>${s.runs}</td><td>${s.hs}${s.hsno?'*':''}</td><td>${avg}</td></tr>`;
  }).join('');
  const bowlRows=p.bowl_seasons.filter(s=>s.wkts>0||s.runs>0).map(s=>{
    const avg=s.wkts>0?(s.runs/s.wkts).toFixed(1):'-';const ov=(s.balls/6).toFixed(0);
    return `<tr><td>${s.season} ${s.grade}</td><td>${s.m}</td><td>${ov}</td><td>${s.wkts}</td><td>${s.runs}</td><td>${s.best}</td><td>${avg}</td></tr>`;
  }).join('');
  app.innerHTML=`<main><div class="page show">
    <span class="back" onclick="go('players')">← All players</span>
    <div class="phero"><h2>${p.name}</h2><div class="pn">CAREER · 2012/13–2025/26</div>
      <div class="pstats">
        <div class="ps"><div class="n">${p.matches}</div><div class="l">Matches</div></div>
        <div class="ps"><div class="n">${fmt(b.runs)}</div><div class="l">Runs · avg ${b.avg}${b.sr_known?` · SR ${b.sr_known}`:''}</div></div>
        <div class="ps"><div class="n">${w.wkts}</div><div class="l">Wickets · avg ${w.avg||'-'}</div></div>
        <div class="ps"><div class="n">${b.hs}${b.hsno?'*':''}</div><div class="l">High Score</div></div>
      </div>${badgeHtml}</div>
    ${stripHtml}
    ${achHtml}
    ${awardsHtml}
    ${baggyHtml}
    ${premHtml}
    ${rolesHtml}
    ${b.runs>0?`<div class="mini-h">Batting by Season</div>
      <table><thead><tr><th>Season / Grade</th><th>M</th><th>Inn</th><th>Runs</th><th>HS</th><th>Avg</th></tr></thead><tbody>${batRows}</tbody></table>
      <div class="pmeta" style="margin-top:8px">Career: ${b.inns} inns · ${b.no} not out · ${b.fifties} fifties · ${b.hundreds} hundreds · ${b.fours} fours · ${b.sixes} sixes · ${b.ducks} ducks</div>`:''}
    ${w.wkts>0?`<div class="mini-h">Bowling by Season</div>
      <table><thead><tr><th>Season / Grade</th><th>M</th><th>Ov</th><th>Wkt</th><th>Runs</th><th>Best</th><th>Avg</th></tr></thead><tbody>${bowlRows}</tbody></table>
      <div class="pmeta" style="margin-top:8px">Career: ${w.wkts} wkts · avg ${w.avg} · econ ${w.econ} · SR ${w.sr} · ${w.maidens} maidens · best ${w.best} · ${w.fivefa} five-fors</div>`:''}
    <div class="note">Match counts are official WGCC career game records across both the MyCricket and PlayHQ eras (all appearances, including fielding-only games).</div>
    ${careerGradeHtml(p)}
    ${formHtml(p)}
    ${trajectoryHtml(p)}
    ${careerSpanHtml(p)}
    ${fieldingHtml(p)}
    ${playhqHlHtml(p)}
    ${bbb2526Html(p)}
    ${milestonesTLHtml(p)}
    ${seasonSplitHtml(p)}
    ${oppRecordsHtml(p)}
    ${matesOppsHtml(p)}
    ${analyticsHtml(p)}
    ${gameLogHtml(p)}
  </div></main>`;
  window.scrollTo(0,0);
}

function showFullRecord(key,title,vlabel){
  const list=DATA.records_full&&DATA.records_full[key];
  if(!list) return;
  const rows=list.map((x,i)=>`<tr onclick="closeModal();openPlayer('${x.name.replace(/'/g,"\\'")}')"><td>${i+1}</td><td style="text-align:left">${x.name}</td><td>${x.v}</td></tr>`).join('');
  openModal(title, `All ${list.length} players`, `<table class="fr-table"><thead><tr><th>#</th><th style="text-align:left">Player</th><th>${vlabel}</th></tr></thead><tbody>${rows}</tbody></table>`);
}
function eraHtml(){
  const e=DATA.era; if(!e||!e.length) return '';
  const maxR=Math.max(...e.map(x=>x.runs||0));
  const bars=e.map(x=>{
    const h=Math.round((x.runs||0)/maxR*64);
    return `<div class="er-col" title="${x.s}: ${x.runs} runs, avg ${x.avg}, ${x.wkts} wkts">
      <div class="er-bar" style="height:${h}px"></div>
      <div class="er-lab">${x.s.slice(2,4)}</div></div>`;
  }).join('');
  const best=e.reduce((a,b)=>((b.avg||0)>(a.avg||0)?b:a),e[0]);
  const rows=e.slice().reverse().map(x=>`<tr>
    <td>${x.s}</td><td>${x.runs}</td><td>${x.avg!=null?x.avg:'—'}</td>
    <td>${x.f||0}/${x.h||0}</td><td>${x.wkts}</td>
    <td>${x.bavg!=null?x.bavg:'—'}</td><td>${x.econ!=null?x.econ:'—'}</td>
    <td>${x.winpct!=null?x.winpct+'%':'—'}</td></tr>`).join('');
  return `<section style="margin-top:34px"><div class="sec-head"><h3>Era Comparison · Season by Season</h3><span class="more">Club-wide, all grades</span></div>
    <div class="er-wrap">${bars}</div>
    <div class="er-key">Total runs scored by the club each season · highest team batting average was ${best.s} (${best.avg})</div>
    <table style="margin-top:12px"><thead><tr><th>Season</th><th>Runs</th><th>Bat Avg</th><th>50s/100s</th><th>Wkts</th><th>Bowl Avg</th><th>Econ</th><th>Win %</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="note">Aggregated from every player's season records across all grades. Batting average is runs per dismissal club-wide; a higher figure means a better run-scoring season. Win % is from club match records.</div>
  </section>`;
}
function debutClassHtml(){
  const c=DATA.debut_classes_full; if(!c||!c.length) return '';
  const cards=c.slice().reverse().map(x=>`<div class="dc-card">
    <div class="dc-season">${x.season} <span class="dc-n">${x.n} debut${x.n===1?'':'s'}${x.active_n?` · ${x.active_n} still playing`:''}</span></div>

let fixGrade=null;
function pLink(nm){
  return DATA.players[nm]
    ? `<span class="fx-player" onclick="openPlayer('${nm.replace(/'/g,"\\'")}')">${nm.split(' ').slice(-1)[0]}</span>`
    : nm.split(' ').slice(-1)[0];

function renderFixtures(){
  const U=DATA.upcoming_fixtures;
  if(!U) return '';
  const grades=Object.keys(U.grades);
  if(!fixGrade) fixGrade=grades[0];
  const tabs=grades.map(g=>`<button class="fx-tab ${g===fixGrade?'active':''}" onclick="setFixGrade('${g.replace(/'/g,"\\'")}')">${g}</button>`).join('');
  const today=new Date();today.setHours(0,0,0,0);
  const list=U.grades[fixGrade].map(m=>{
    const d=new Date(m.date+'T00:00:00');
    const dd=d.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
    const vs=m.home?'vs':'@';
    const played=!!m.result;
    const won=m.result==='won';
    const cls=played?(won?'fx-won':'fx-lost'):(d<today?'fx-past':'');
    const badge=played?`<span class="fx-badge ${won?'fx-b-won':'fx-b-lost'}">${won?'WON':'LOST'}</span>`:'';
    // score line + notable performers
    let detail='';
    if(played){
      const scoreLine=(m.wg_score&&m.opp_score)?`WGCC ${m.wg_score} ${won?'def':'def by'} ${m.opp} ${m.opp_score} · ${m.margin}`:m.margin;
      const key=`2026/2027|${fixGrade}|${m.round}`;
      const nb=DATA.fixture_notable&&DATA.fixture_notable[key];
      let perf='';
      if(nb){
        const bats=(nb.bat||[]).map(b=>`${pLink(b.name)} ${b.runs}${b.no?'*':''}`).join(', ');
        const bowls=(nb.bowl||[]).map(b=>`${pLink(b.name)} ${b.w}/${b.r}`).join(', ');
        perf=`${bats?`<div class="fx-perf"><span class="fx-pl">Bat</span> ${bats}</div>`:''}${bowls?`<div class="fx-perf"><span class="fx-pl">Bowl</span> ${bowls}</div>`:''}`;
      }
      detail=`<div class="fx-detail"><div class="fx-score">${scoreLine}</div>${perf}</div>`;
    }
    return `<div class="fx-row ${cls}">
      <div class="fx-rowtop">
        <div class="fx-rd">${m.round.replace('Round ','R')}</div>
        <div class="fx-main"><div class="fx-opp">${vs} ${m.opp} ${badge}</div><div class="fx-meta">${m.venue} · ${m.format}</div></div>
        <div class="fx-date">${dd}</div>
      </div>
      ${detail}
    </div>`;
  }).join('');
  return `<section style="margin-bottom:30px"><div class="sec-head"><h3>2026/27 Fixtures &amp; Results</h3><span class="more">${U.season} · ${grades.length} teams</span></div>
    <div class="fx-tabs">${tabs}</div>
    <div class="fx-list">${list}</div>
    <div class="note">Home games shown as "vs", away as "@". Completed games show the result and notable performances; upcoming games show the scheduled fixture.</div>
  </section>`;
}

          const t=bd.reduce((a,r)=>({w:a.w+(r.w||0),l:a.l+(r.l||0)}),{w:0,l:0});
          const d=t.w+t.l;
          if(d) rec=`<span class="res-w">${t.w}W</span> · <span class="res-l">${t.l}L</span> <span style="font-family:var(--mono);font-size:11px;color:#8a8a7a">${Math.round(100*t.w/d)}%</span>`;
        }
        return `<tr class="szn-click" onclick="showVenue('${v.name.replace(/'/g,"\\'")}')"><td>▸ ${i+1}. ${v.name}${bd?' <span class="bd-tag">A</span>':''}</td><td>${v.v}</td><td>${rec}</td></tr>`;
      }).join('')}
      </tbody></table>
      <div class="note">Home ground Penistone Park leads as expected; the rest are away venues across the association. Win/loss records currently cover A Grade only (2023/24–2025/26) and will fill out as each grade is added. One 2024/25 fixture has no venue recorded, so ground totals sit one game below the club total.</div>
    </section>
  </div></main>`;
}

function combinedAwardsTable(H,E,link){
  const awards=[
    ['ClubChamp',H.champions],['U21',E.under21],['Clubperson',E.clubperson],
    ['Keeper',E.wk_year],['NonCompos',E.non_compos],
  ];
  const seasons=new Set();
  awards.forEach(([k,arr])=>arr.forEach(a=>seasons.add(a.season)));
  const sList=[...seasons].sort().reverse();
  const byKey={};
  awards.forEach(([k,arr])=>{byKey[k]={};arr.forEach(a=>{byKey[k][a.season]={name:a.name,detail:a.detail,canon:a.canon};});});
  const cell=(k,s)=>{const v=byKey[k][s];return v?`${link(v.name,v.canon)}${v.detail?`<div style="font-size:11px;color:#8a8a7a">${v.detail}</div>`:''}`:'<span style="color:#ccc">—</span>';};
  const rows=sList.map(s=>`<tr><td><b>${s}</b></td><td style="text-align:left">${cell('ClubChamp',s)}</td><td style="text-align:left">${cell('U21',s)}</td><td style="text-align:left">${cell('Clubperson',s)}</td><td style="text-align:left">${cell('Keeper',s)}</td><td style="text-align:left">${cell('NonCompos',s)}</td></tr>`).join('');
  return `<div style="overflow-x:auto"><table><thead><tr><th>Season</th><th style="text-align:left">Club Champion<div style="font-size:9px;font-weight:400;text-transform:none">Craven/Lowth</div></th><th style="text-align:left">U21 POY</th><th style="text-align:left">Clubperson<div style="font-size:9px;font-weight:400;text-transform:none">Farr-Stickland-Wood</div></th><th style="text-align:left">Wicket Keeper<div style="font-size:9px;font-weight:400;text-transform:none">Birchall/Nuttall</div></th><th style="text-align:left">Non Compos Mentis</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function showScorecard(key){

function goalOutcome(txt){
  if(txt==null) return {cls:'wf-na',ic:'–',lbl:'—'};
  const s=txt.toLowerCase();
  if(s.includes('won')) return {cls:'wf-won',ic:'🏆',lbl:txt};
  if(s.includes('lost')||s.includes('missed')||s.includes('did not')) return {cls:'wf-lost',ic:'▪',lbl:txt};
  return {cls:'wf-neut',ic:'▪',lbl:txt};
}
function gradeGoalCard(l){

    return `<div class="wf-card wf-blank">

}

      body=`<p class="note" style="margin-bottom:12px">Three goals per grade: <b>Two-Day Premiership</b>, <b>One-Day Premiership</b>, <b>Minor Premiership</b> (top of ladder).</p>

      const rows=src.map(r=>{
        const dec=(r.w||0)+(r.l||0)+(r.d||0);
        const wr=dec>0?Math.round(100*r.w/dec):null;
        const fin=(r.finals||[]).map(f=>{
          const cls=f.outcome==='won'?'sf-won':'sf-lost';
          const lbl=f.round.replace('Grand Final','GF').replace('Semi Finals','SF').replace('Preliminary Final','PF');
          return `<span class="sf-chip ${cls}">${lbl} ${f.outcome==='won'?'won':'lost'}</span>`;
        }).join('');
        return `<tr><td>${r.grade}</td><td>${r.p}</td><td class="res-w">${r.w}</td><td class="res-l">${r.l}</td><td>${wr!=null?wr+'%':'\u2014'}</td><td style="text-align:left">${fin||'<span style="color:#8a8a7a">\u2014</span>'}</td></tr>`;
      }).join('');
      const t2=src.reduce((a,r)=>({p:a.p+(r.p||0),w:a.w+(r.w||0),l:a.l+(r.l||0)}),{p:0,w:0,l:0});
      const dec2=t2.w+t2.l;
      body=`<table><thead><tr><th>Grade</th><th>P</th><th class="res-w">W</th><th class="res-l">L</th><th>Win %</th><th style="text-align:left">Finals</th></tr></thead><tbody>${rows}</tbody></table>
        <div class="cs-tot">Club total: <b>${t2.p}</b> played \u00b7 <b>${t2.w}</b> won \u00b7 <b>${t2.l}</b> lost${dec2?` \u00b7 <b>${Math.round(100*t2.w/dec2)}%</b>`:''}</div>`;
    }
  }else{
    body=comingSoon(`Per-grade results for ${season} haven't been loaded yet.`);
  }
  openModal(`${season} \u00b7 Results by Grade`, 'Each grade\u2019s season, grade by grade', body);
}
function pendingNote(loaded){
  const n=loaded.length;
  return `<div class="cs-pending">Covers <b>${n}</b> grade${n===1?'':'s'} from PlayHQ records (2023/24\u20132025/26). Earlier MyCricket seasons are not yet broken down by grade.</div>`;
}
function showH2H(club){
  const src=(DATA.h2h_by_grade&&DATA.h2h_by_grade[club])||null;
  let body;
  if(src&&src.length){
    const tot=src.reduce((a,r)=>({p:a.p+(r.p||0),w:a.w+(r.w||0),l:a.l+(r.l||0)}),{p:0,w:0,l:0});
    const dec=tot.w+tot.l;
    body=gradeResultsTable(src)
      +`<div class="cs-tot">Across loaded grades: <b>${tot.p}</b> played · <b>${tot.w}</b> won · <b>${tot.l}</b> lost${dec?` · ${Math.round(100*tot.w/dec)}%`:''}</div>`
      +pendingNote(src.map(r=>r.grade));
  }else{
    body=comingSoon(`Grade-by-grade record against ${club} hasn't been loaded yet.`);
  }
  openModal(`vs ${club}`, 'Our record against them, grade by grade', body);
}
function showVenue(venue){
  const src=(DATA.venue_by_grade&&DATA.venue_by_grade[venue])||null;
  let body;
  if(src&&src.length){
    const tot=src.reduce((a,r)=>({g:a.g+(r.games||0),w:a.w+(r.w||0),l:a.l+(r.l||0)}),{g:0,w:0,l:0});
    const dec=tot.w+tot.l;
    body=`<table><thead><tr><th>Grade</th><th>Played</th><th class="res-w">W</th><th class="res-l">L</th><th>Win %</th></tr></thead><tbody>
      ${src.map(r=>{const d=(r.w||0)+(r.l||0);
        return `<tr><td>${r.grade}</td><td>${r.games!=null?r.games:'—'}</td><td class="res-w">${r.w!=null?r.w:'—'}</td><td class="res-l">${r.l!=null?r.l:'—'}</td><td>${d?Math.round(100*r.w/d)+'%':'—'}</td></tr>`;
      }).join('')}
    </tbody></table>
    <div class="cs-tot">Across loaded grades: <b>${tot.g}</b> played · <b>${tot.w}</b> won · <b>${tot.l}</b> lost${dec?` · <b>${Math.round(100*tot.w/dec)}%</b>`:''}</div>`
    +pendingNote(src.map(r=>r.grade));
  }else{
    body=comingSoon(`The grade breakdown for ${venue} hasn't been loaded yet.`);
  }
  openModal(venue, 'Our record at this ground', body);
}
function showGame(rnd){
  const sc=DATA.agrade_scorecards_2526&&DATA.agrade_scorecards_2526[rnd]; if(!sc) return;
  const linkN=(name,canon)=>canon&&DATA.players[canon]?`<span style="cursor:pointer;color:var(--field-bright)" onclick="closeModal();openPlayer('${canon.replace(/'/g,"\\'")}')">${name}</span>`:name;
  const cards=sc.innings.map(inn=>{
    const batRows=inn.bat.map(b=>`<tr><td>${inn.isWG?linkN(b.name,b.canon):b.name}</td><td style="font-size:12px;color:#8a8a7a;text-align:left">${b.how||''}</td><td>${b.r!=null?b.r+(b.no?'*':''):''}</td><td>${b.b!=null?b.b:''}</td></tr>`).join('');
    const bowlRows=inn.bowl.map(b=>`<tr><td>${!inn.isWG?linkN(b.name,b.canon):b.name}</td><td>${b.o!=null?b.o:''}</td><td>${b.m!=null?b.m:''}</td><td>${b.r!=null?b.r:''}</td><td>${b.w!=null?b.w:''}</td></tr>`).join('');
    return `<div class="sc-inn">
      <div class="sc-team">${inn.team} — <b>${inn.total!=null?inn.total:''}</b>${inn.overs?` (${inn.overs} ov)`:''}</div>
      <table class="sc-bat"><thead><tr><th>Batter</th><th style="text-align:left">How Out</th><th>R</th><th>B</th></tr></thead><tbody>${batRows}</tbody></table>
      ${bowlRows?`<table class="sc-bowl"><thead><tr><th>Bowler</th><th>O</th><th>M</th><th>R</th><th>W</th></tr></thead><tbody>${bowlRows}</tbody></table>`:''}
    </div>`;
  }).join('');
  const modal=document.createElement('div');
  modal.className='modal-bg'; modal.id='scmodal';
  modal.onclick=(e)=>{if(e.target===modal)closeModal();};
  modal.innerHTML=`<div class="modal">
    <div class="modal-head"><div><div class="modal-title">A Grade 2025/26 · ${rnd}</div>
    <div class="modal-sub">${sc.result||''}${sc.venue?' · '+sc.venue:''}</div></div>
    <span class="modal-x" onclick="closeModal()">✕</span></div>
    <div class="modal-body">${cards}</div></div>`;
  document.body.appendChild(modal);
  document.body.style.overflow='hidden';
}

// ---------- CLUB INSIGHTS ----------
function pctBar(pct,n){
  const w=Math.max(0,Math.min(100,pct||0));
  return `<div class="ib-track"><div class="ib-fill" style="width:${w}%"></div></div>`;
}
function sampleTag(n){ return `<span class="ins-n">n=${n}</span>`; }
function oddsHtml(){
  const pts=(DATA.honours&&DATA.honours.prem_teams)||[];
  if(!pts.length) return comingSoon('Premiership data not loaded.');
  const withPos=pts.map(t=>({...t,pos:parseInt(String(t.finish).replace(/[^0-9]/g,''),10)})).filter(t=>t.pos);
  const below=withPos.filter(t=>t.pos>1).sort((a,b)=>b.pos-a.pos);
  const top=withPos.length-below.length;
  const rows=below.map(t=>{
    const rec=(t.w!=null)?`${t.w}-${t.l}${t.d?'-'+t.d:''}`:'\u2014';
    const cls=t.pos>=4?'bg-bad':'';
    return `<tr class="${cls}"><td>${t.season}</td><td>${t.grade} ${t.match}</td><td><span class="pm-run">${t.finish}</span></td><td style="font-family:var(--mono);font-size:12px">${rec}</td><td>${t.captain}</td></tr>`;
  }).join('');
  // Biggest upsets — now that we have opponent ladder positions (2025/26)
  const U=DATA.upsets||DATA.upsets_2526;
  let upsetBlock='';
  if(U&&(U.best_wins.length||U.worst_losses.length)){
    const ord=p=>{const s=['th','st','nd','rd'],v=p%100;return p+(s[(v-20)%10]||s[v]||s[0]);};
    const sea=u=>u.season?u.season.slice(0,7).replace(/(\d{4})\/(\d{2}).*/,'$1/$2'):'';
    const winRows=U.best_wins.filter(u=>u.gap>0).slice(0,6).map(u=>
      `<tr><td style="font-family:var(--mono);font-size:11px">${sea(u)}</td><td>${u.grade}</td><td>${u.opp}</td><td><span class="pm-run">${ord(u.opp_pos)}</span></td><td>${ord(u.our_pos)}</td><td class="res-w">+${u.gap}</td></tr>`).join('');
    const lossRows=U.worst_losses.filter(u=>u.gap<0).slice(0,6).map(u=>
      `<tr class="bg-bad"><td style="font-family:var(--mono);font-size:11px">${sea(u)}</td><td>${u.grade}</td><td>${u.opp}</td><td><span class="pm-run">${ord(u.opp_pos)}</span></td><td>${ord(u.our_pos)}</td><td class="res-l">${u.gap}</td></tr>`).join('');
    upsetBlock=`
      <div style="margin-top:26px"><div class="mini-h">Biggest Wins <span style="font-family:var(--mono);font-size:11px;color:#8a8a7a">(beat higher-finishing sides)</span></div>
      ${winRows?`<table><thead><tr><th>Season</th><th>Grade</th><th>Opponent</th><th>They finished</th><th>We finished</th><th>Gap</th></tr></thead><tbody>${winRows}</tbody></table>`:'<div class="note">No wins over higher-finishing sides.</div>'}</div>
      <div style="margin-top:22px"><div class="mini-h">Costliest Losses <span style="font-family:var(--mono);font-size:11px;color:#8a8a7a">(lost to lower-finishing sides)</span></div>
      ${lossRows?`<table><thead><tr><th>Season</th><th>Grade</th><th>Opponent</th><th>They finished</th><th>We finished</th><th>Gap</th></tr></thead><tbody>${lossRows}</tbody></table>`:'<div class="note">No losses to lower-finishing sides.</div>'}</div>
      <div class="note">Each result (2023/24 to 2025/26) weighted by where the opponent finished on the final ladder. "Gap" is the number of ladder places between the sides \u2014 a big positive on a win means we beat a side that finished well above us. Ladder positions loaded for every grade across all three PlayHQ seasons.</div>`;
  }
  return `<p class="note" style="margin-bottom:10px">Of the club's <b>${withPos.length}</b> premierships, <b>${top}</b> came from minor premiers and <b>${below.length}</b> were won from further down the ladder.</p>
    <table><thead><tr><th>Season</th><th>Grade</th><th>Finished</th><th>Season record</th><th>Captain</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="note">Ranked by how far down the ladder the side finished.</div>
    ${upsetBlock}`;
}
function renderInsights(){
  const I=DATA.insights; if(!I) return '<main><div class="page show"><section><div class="note">Insights not available.</div></section></div></main>';
  const base=I.close.baseline;

  // --- headline cards ---
  const cl=I.close.overall;
  const gapClose=cl.pct-base.pct;
  const mw=I.margins.win_runs, ml=I.margins.loss_runs;
  const headline=`<div class="ins-head">
    <div class="ins-card ins-alert">
      <div class="ins-k">Close games</div>
      <div class="ins-v">${cl.pct}%</div>
      <div class="ins-d">won, against <b>${base.pct}%</b> overall — ${Math.abs(gapClose)===8||Math.abs(gapClose)===11||Math.abs(gapClose)===18?"an":"a"} ${Math.abs(gapClose)} point drop ${sampleTag(cl.p)}</div>
    </div>
    <div class="ins-card">
      <div class="ins-k">Winning margin</div>
      <div class="ins-v">${mw?mw.med:'—'}<span class="ins-u"> runs</span></div>
      <div class="ins-d">median win, vs <b>${ml?ml.med:'—'}</b> median loss — we win bigger than we lose ${sampleTag((mw?mw.n:0)+(ml?ml.n:0))}</div>
    </div>
    <div class="ins-card">
      <div class="ins-k">Longest win streak</div>
      <div class="ins-v">${I.streaks.club.won.n}</div>
      <div class="ins-d">games across all grades, to ${I.streaks.club.won.to||''}</div>
    </div>
    <div class="ins-card">
      <div class="ins-k">Finals record</div>
      <div class="ins-v">${I.finals.pct!=null?I.finals.pct+'%':'—'}</div>
      <div class="ins-d">${I.finals.w}W ${I.finals.l}L in finals ${sampleTag(I.finals.p)}</div>
    </div>
  </div>`;

  // --- close games by grade ---
  const closeRows=I.close.by_grade.map(g=>`<tr>
    <td>${g.grade}</td><td>${g.p}</td><td class="res-w">${g.w}</td><td class="res-l">${g.l}</td>
    <td>${g.pct!=null?g.pct+'%':'—'}</td><td>${pctBar(g.pct)}</td></tr>`).join('');

  // --- home / away ---
  const ha=I.homeaway;
  const haRows=ha.by_grade.map(g=>`<tr>
    <td>${g.grade}</td>
    <td>${g.home.pct!=null?g.home.pct+'%':'—'} <span class="ins-sub">${g.home.w}-${g.home.l}</span></td>
    <td>${g.away.pct!=null?g.away.pct+'%':'—'} <span class="ins-sub">${g.away.w}-${g.away.l}</span></td>
    <td>${(g.home.pct!=null&&g.away.pct!=null)?((g.home.pct-g.away.pct>0?'+':'')+(g.home.pct-g.away.pct)):'—'}</td></tr>`).join('');

  // --- format ---
  const fmtRows=I.format.overall.map(f=>`<tr>
    <td>${f.fmt}</td><td>${f.p}</td><td class="res-w">${f.w}</td><td class="res-l">${f.l}</td>
    <td>${f.pct}%</td><td>${pctBar(f.pct)}</td></tr>`).join('');

  // --- margin buckets ---
  const maxB=Math.max(1,...I.margins.buckets.map(b=>Math.max(b.won,b.lost)));
  const bucketBars=I.margins.buckets.map(b=>`<div class="mg-col">
    <div class="mg-pair">
      <div class="mg-w" style="height:${Math.round(b.won/maxB*70)}px" title="${b.won} wins by ${b.b} runs"></div>
      <div class="mg-l" style="height:${Math.round(b.lost/maxB*70)}px" title="${b.lost} losses by ${b.b} runs"></div>
    </div><div class="mg-lab">${b.b}</div></div>`).join('');

  // --- season shape ---
  const shape=I.shape.filter(s=>s.n>=4);
  const shapeBars=shape.map(s=>`<div class="sh-col" title="Round ${s.r}: ${s.w}W ${s.l}L (${s.n} games)">
    <div class="sh-stack"><div class="sh-fill" style="height:${Math.round((s.pct||0)*0.7)}px"></div></div>
    <div class="sh-pct">${s.pct}%</div><div class="sh-lab">R${s.r}</div></div>`).join('');

  // --- streaks by grade ---
  const stRows=I.streaks.by_grade.map(g=>`<tr>
    <td>${g.grade}</td><td class="res-w">${g.win.n}</td><td class="res-l">${g.loss.n}</td><td>${g.n}</td></tr>`).join('');

  // --- bogey ---
  const bg=I.bogey;
  const bogeyRows=bg.teams.map(t=>{
    const cls=t.diff<=-15?'bg-bad':t.diff>=15?'bg-good':'';
    const sign=t.diff>0?'+':'';
    return `<tr class="${cls}"><td>${t.opp}</td><td>${t.p}</td><td class="res-w">${t.w}</td><td class="res-l">${t.l}</td>
      <td>${t.pct}%</td><td class="${t.diff<0?'res-l':'res-w'}">${sign}${t.diff}</td></tr>`;
  }).join('');

  return `<main><div class="page show">
    <section><div class="sec-head"><h3>Club Insights</h3><span class="more">PlayHQ era · ${base.p} completed games</span></div>
    <p class="note" style="margin-bottom:14px">Patterns across every grade from 2023/24 to 2025/26. Sample sizes are shown throughout — small samples move around a lot, so treat anything under about 15 games as a hint rather than a finding.</p>
    ${headline}
    </section>

    <section style="margin-top:30px"><div class="sec-head"><h3>Close Games</h3><span class="more">${I.close.definition}</span></div>
      <p class="note" style="margin-bottom:10px">The clearest pattern in the data. The club wins <b>${base.pct}%</b> of all games but only <b>${cl.pct}%</b> of tight ones — ${cl.w} from ${cl.p}.</p>
      <table><thead><tr><th>Grade</th><th>Close</th><th class="res-w">W</th><th class="res-l">L</th><th>Win %</th><th style="width:110px"></th></tr></thead><tbody>${closeRows}</tbody></table>
      <div class="note">Grades with at least 2 close games. A tight-game record well below a side's overall record can point to finishing, game management or nerve rather than ability.</div>
    </section>

    <section style="margin-top:30px"><div class="sec-head"><h3>Home &amp; Away</h3></div>
      <div class="ins-split">
        <div class="sp-box"><div class="sp-k">Home</div><div class="sp-v">${ha.home.pct}%</div><div class="sp-d">${ha.home.w}W ${ha.home.l}L ${sampleTag(ha.home.p)}</div>${pctBar(ha.home.pct)}</div>
        <div class="sp-box"><div class="sp-k">Away</div><div class="sp-v">${ha.away.pct}%</div><div class="sp-d">${ha.away.w}W ${ha.away.l}L ${sampleTag(ha.away.p)}</div>${pctBar(ha.away.pct)}</div>
      </div>
      <table style="margin-top:12px"><thead><tr><th>Grade</th><th>Home</th><th>Away</th><th>Gap</th></tr></thead><tbody>${haRows}</tbody></table>
      <div class="note">Only a ${Math.abs(ha.home.pct-ha.away.pct)} point home advantage club-wide — smaller than most clubs assume. Grades with 6+ games shown.</div>
    </section>

    <section style="margin-top:30px"><div class="sec-head"><h3>By Format</h3></div>
      <table><thead><tr><th>Format</th><th>P</th><th class="res-w">W</th><th class="res-l">L</th><th>Win %</th><th style="width:110px"></th></tr></thead><tbody>${fmtRows}</tbody></table>
      <div class="note">Shorter formats suit the club: the T20 record is well clear of the two-day record, though on a much smaller sample.</div>
    </section>

    <section style="margin-top:30px"><div class="sec-head"><h3>Margins</h3><span class="more">How we win vs how we lose</span></div>
      <div class="mg-wrap">${bucketBars}</div>
      <div class="mg-key"><span class="mg-sw mg-w-sw"></span> won by <span class="mg-sw mg-l-sw"></span> lost by · runs only</div>
      <div class="ins-grid2" style="margin-top:12px">
        <div class="ins-stat"><div class="ins-k">Median winning margin</div><div class="ins-v2">${mw?mw.med:'—'} runs</div><div class="ins-d">biggest ${mw?mw.max:'—'} ${sampleTag(mw?mw.n:0)}</div></div>
        <div class="ins-stat"><div class="ins-k">Median losing margin</div><div class="ins-v2">${ml?ml.med:'—'} runs</div><div class="ins-d">biggest ${ml?ml.max:'—'} ${sampleTag(ml?ml.n:0)}</div></div>
      </div>
      <div class="note">Winning by more than we lose by suggests the raw win rate understates how competitive the club is — many losses are narrow.</div>
    </section>

    <section style="margin-top:30px"><div class="sec-head"><h3>Season Shape</h3><span class="more">Win rate by round</span></div>
      <div class="sh-wrap">${shapeBars}</div>
      <div class="note">Every grade's results pooled by round number, so it reads as the club's typical season arc rather than any one side's. Rounds with fewer than 4 games are hidden. Finals are counted separately: <b>${I.finals.w}W ${I.finals.l}L</b>.</div>
    </section>

    <section style="margin-top:30px"><div class="sec-head"><h3>Streaks</h3></div>
      <table><thead><tr><th>Grade</th><th class="res-w">Longest win run</th><th class="res-l">Longest loss run</th><th>Games</th></tr></thead><tbody>${stRows}</tbody></table>
      <div class="note">Club-wide, the longest winning sequence across all grades chronologically is <b>${I.streaks.club.won.n}</b> games; the longest losing run is <b>${I.streaks.club.lost.n}</b>. Grades with 8+ games shown.</div>
    </section>

    <section style="margin-top:30px"><div class="sec-head"><h3>Bogey Teams</h3><span class="more">vs our ${bg.baseline}% baseline</span></div>
      <table><thead><tr><th>Opponent</th><th>P</th><th class="res-w">W</th><th class="res-l">L</th><th>Win %</th><th>vs baseline</th></tr></thead><tbody>${bogeyRows}</tbody></table>
      <div class="note">Opponents played 6 or more times, ranked by how far our record against them sits from our overall ${bg.baseline}%. Negative figures are sides we underperform against.</div>
    </section>

    <section style="margin-top:30px"><div class="sec-head"><h3>Against The Odds</h3><span class="more">Premiership run difficulty</span></div>
      ${oddsHtml()}
    </section>
  </div></main>`;
}

// ---------- ROUTER ----------
function go(p){
  setNav(p); location.hash=p;
  if(p==='home') app.innerHTML=renderHome();
  else if(p==='players'){app.innerHTML=renderPlayers();drawPlayerTable();}
  else if(p==='records') app.innerHTML=renderRecords();
  else if(p==='honours') app.innerHTML=renderHonours();
  else if(p==='results') app.innerHTML=renderResults();
  else if(p==='insights') app.innerHTML=renderInsights();
  window.scrollTo(0,0);
}
function route(){
  const hash=decodeURIComponent(location.hash.replace('#',''));
  if(hash.startsWith('player/')) openPlayer(hash.slice(7));
  else if(['players','records','honours','results','insights'].includes(hash)) go(hash);
  else go('home');
}

async function boot(){
  try{
    const res=await fetch('data.json',{cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    DATA=await res.json();
  }catch(e){
    var el=document.getElementById('app');
    if(el) el.innerHTML='<main><div class="page show"><section><div class="note">Could not load stats data (data.json). If you opened this file directly from disk, it must be served from a web host (e.g. GitHub Pages) — browsers block local file data loads. Error: '+e.message+'</div></section></div></main>';
    return;
  }
  INIT();
}
function INIT(){
window.addEventListener('hashchange',route);
route();
document.getElementById('footnote').textContent='Win rate '+DATA.home.win_rate+' · '+DATA.home.games+' games';
}
boot();
</script>
</body>
</html>
